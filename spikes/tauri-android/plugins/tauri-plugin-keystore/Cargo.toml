[package]
name = "tauri-plugin-keystore"
version = "0.1.0"
authors = [ "Flint" ]
description = "Android Keystore + fingerprint-gated key wrapping (M0 spike)"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-keystore"

[dependencies]
tauri = { version = "2.10.3" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
