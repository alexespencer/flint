<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flint Spike</title>
    <style>
      body { font-family: system-ui; margin: 0; padding: 8px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
      button { font-size: 0.95em; padding: 6px 10px; margin: 0 4px 4px 0; }
      #out, #stats { font: 12px/1.3 monospace; margin: 2px 0; white-space: pre-wrap; }
      #stats { font-weight: 600; }
      #editor { flex: 1; min-height: 0; border: 1px solid #888; }
      #editor .cm-editor { height: 100%; }
      #editor .cm-scroller { overflow: auto; }
    </style>
  </head>
  <body>
    <div>
      <button id="l500">500</button><button id="l5000">5,000</button><button id="l5000plain">5,000 plain</button><button id="l20000">20,000</button><button id="probe">file probe</button>
      <hr style="margin:4px 0">
      <button id="ks-status">KS status</button><button id="ks-wrap">KS wrap</button><button id="ks-unwrap">KS unwrap</button><button id="ks-forget">KS forget</button>
    </div>
    <div id="out"></div>
    <div id="stats"></div>
    <div id="editor"></div>
    <script src="editor.js"></script>
  </body>
</html>
