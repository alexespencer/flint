[package]
name = "spike-s3-conditional"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
object_store = { version = "0.14", features = ["aws"] }
s3s-fs = "0.17"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
tempfile = "3"
bytes = "1"
s3s = "0.17"
futures-core = "0.3"
