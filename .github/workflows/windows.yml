# Builds the Windows installer and runs the tests on Windows. See docs/windows.md.
#
# - every push to any branch: tests, and an installer you can download from the run's "Artifacts"
# - a tag like v0.1.0: the same, and the installer is attached to a GitHub release
# - the "Run workflow" button on the Actions tab runs it by hand
#
# Minutes: Windows runners count double against a private repo's free allowance (2,000 minutes a month on the
# Free plan, so about 1,000 Windows minutes). A cached run takes about 8-12 minutes per job. Public repos are free.
name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# a newer push to the same branch makes the older, still-running one pointless
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to attach the installer to a release when a tag is pushed

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the version is pinned in rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # SQLCipher builds OpenSSL from source: it needs NASM, Perl (already on the runner) and the MSVC tools
      - uses: ilammy/setup-nasm@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Tests
        run: cargo test --workspace

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Rust (the version is pinned in rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build the installer
        working-directory: crates/flint-tauri
        run: bunx @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: flint-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
