# Builds the Windows installer and runs the tests on Windows. See docs/windows.md.
#
# - every push to any branch: builds an installer you can download from the run's "Artifacts", then runs the tests
# - a tag like v0.1.0: the same, and the installer is attached to a GitHub release
# - the "Run workflow" button on the Actions tab runs it by hand
#
# Minutes: Windows runners count double against a private repo's free allowance (2,000 minutes a month on the
# Free plan, so about 1,000 Windows minutes). Public repos are free.
name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# a newer push to the same branch makes the older, still-running one pointless
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# read-only by default; only the release job below can write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Rust (the version is pinned in rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # SQLCipher builds OpenSSL from source: it needs NASM, Perl (already on the runner) and the MSVC tools
      - uses: ilammy/setup-nasm@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build the installer
        working-directory: crates/flint-tauri
        run: bunx @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: flint-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      # After the installer, so a failing test cannot stop it being built and uploaded. In the release profile,
      # so the dependencies compiled for the installer (OpenSSL above all) are reused instead of built again.
      # flint-tauri is left out: it has two small thread tests, and including it would build Tauri a second
      # time with different features. --no-fail-fast: a Windows run should report every failure, not just the first.
      - name: Tests (release profile)
        run: cargo test --release --workspace --exclude flint-tauri --no-fail-fast

  # A tag only: attaches the installer to a GitHub release. A separate job so that write access to the repo is
  # given to nothing but these two steps, and so a release is only made when the build and the tests passed.
  release:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flint-windows-${{ github.sha }}
          path: installer
      - uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
