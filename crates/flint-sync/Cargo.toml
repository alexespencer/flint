[package]
name = "flint-sync"
description = "The sync engine: plans a sync cycle from local, remote and baseline state, and carries it out without losing a write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
flint-core = { version = "0.0.0", path = "../flint-core" }
flint-crypto = { version = "0.0.0", path = "../flint-crypto" }
flint-remote = { version = "0.0.0", path = "../flint-remote" }
flint-store-fs = { version = "0.0.0", path = "../flint-store-fs" }
flint-sync-state = { version = "0.0.0", path = "../flint-sync-state" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }

[dev-dependencies]
object_store = { version = "0.14.2", default-features = false }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
