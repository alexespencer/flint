version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
camino = "1.2.6"
flint-core = { version = "0.0.0", path = "../flint-core" }
