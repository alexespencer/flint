[package]
name = "flint-md-parse"
description = "Links, headings, tags and frontmatter from markdown notes. Pure: no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
