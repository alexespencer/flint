[package]
name = "flint-crypto"
description = "Key derivation, key wrapping and the encrypted file format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
flint-core = { version = "0.0.0", path = "../flint-core" }
getrandom = "0.4.3"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
