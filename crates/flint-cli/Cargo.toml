[package]
name = "flint-cli"
description = "A headless shell for Flint: the same app service as the app, driven from a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "flint_cli"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
flint-app-service = { version = "0.0.0", path = "../flint-app-service" }
flint-core = { version = "0.0.0", path = "../flint-core" }
flint-crypto = { version = "0.0.0", path = "../flint-crypto" }
flint-registry = { version = "0.0.0", path = "../flint-registry" }
flint-remote = { version = "0.0.0", path = "../flint-remote" }
flint-store-fs = { version = "0.0.0", path = "../flint-store-fs" }
flint-sync = { version = "0.0.0", path = "../flint-sync" }
gethostname = "1.1.0"
rpassword = "7.5.4"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
